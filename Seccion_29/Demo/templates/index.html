<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Collector App</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../static/main.css" />
  </head>
  <body>
    <div class="container-fluid p-5">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">
          <!-- Header Section -->
          <div class="text-center mb-4">
            <h1 class="title mb-3">Collecting Height</h1>
            <div class="alert alert-info" role="alert">
              <i class="bi bi-info-circle-fill me-2"></i>
              Please fill the entries to get population statistics on height.
            </div>
          </div>

          <!-- Form Section -->
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <form action="{{ url_for('success') }}" method="post">
                <!-- Email Field -->
                <div class="mb-4">
                  <label for="email" class="form-label fw-bold">
                    <i class="bi bi-envelope-fill me-2"></i>Email:
                  </label>
                  <input
                    type="email"
                    id="email"
                    name="email_name"
                    class="form-control"
                    placeholder="Enter your email"
                    title="Your email will be safe with us"
                    required
                  />
                  <div class="form-text">
                    <i class="bi bi-shield-check me-1"></i>Your data will be
                    safe with us
                  </div>
                </div>

                <!-- Height Field -->
                <div class="mb-4">
                  <label for="height" class="form-label fw-bold">
                    <i class="bi bi-rulers me-2"></i>Height (cm):
                  </label>
                  <input
                    type="number"
                    id="height"
                    name="height_name"
                    class="form-control"
                    placeholder="Enter your height in cm"
                    title="Your data will be safe with us"
                    min="50"
                    max="300"
                    required
                  />
                  <div class="form-text">
                    Please enter a value between 50 and 300 cm
                  </div>
                </div>

                <!-- Submit Button -->
                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-send-fill me-2"></i>Submit
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Footer Info -->
          <div class="text-center mt-4">
            <p class="text-muted small">
              <i class="bi bi-lock-fill me-1"></i>Your information is encrypted
              and secure
            </p>
          </div>
        </div>
      </div>
    </div>

    {% if error_message %}
    <div
      class="modal fade"
      id="errorModal"
      tabindex="-1"
      aria-labelledby="errorModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="errorModalLabel">
              <i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>
              Email already registered
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">{{ error_message }}</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              OK
            </button>
          </div>
        </div>
      </div>
    </div>
    {% endif %}

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"
    ></script>
    <script src="{{ url_for('static', filename='error-modal.js') }}"></script>
  </body>
</html>
