<!doctype html>
<html>
  <head>
    <title>Flask App</title>
    <link
      rel="stylesheet"
      href="{{url_for('static',filename='css/main.css')}}"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <h1 class="logo">Ardit's web app</h1>
        <strong
          ><nav>
            <ul class="menu">
              <li><a href="{{ url_for('home') }}">Home</a></li>
              <!-- url_for ('home') = llama a la funcion definida como home en el archivo Python -->
              <li><a href="{{ url_for('about') }}">About</a></li>
              <!-- url_for ('about') = llama a la funcion definida como about en el archivo Python -->
            </ul>
          </nav></strong
        >
      </div>
    </header>
    <div class="container">
      {%block content%}
      <!-- bloque de contenido que se va a rellenar en otras plantillas, aqui se puede poner contenido dinamico -->
      {%endblock%}
      <!-- fin del bloque de contenido -->
    </div>
  </body>
</html>
